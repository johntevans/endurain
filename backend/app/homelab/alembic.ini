# Homelab fork: Alembic CLI config for the fork-owned `homelab` schema.
# The backend does not read this file; it runs homelab/db_migrations.py at
# startup. Use it to create revisions, from backend/app:
#
#   uv run --no-sync alembic -c homelab/alembic.ini revision --rev-id hl0002 -m "what changed"
#
# See homelab/README.md (repository root) -> Database.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/..
file_template = %%(rev)s_%%(slug)s
path_separator = os
